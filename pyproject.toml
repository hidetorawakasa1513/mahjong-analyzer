[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-analyzer"
version = "0.1.0"
description = "Local storage and metrics for Mortal review JSON files."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
mahjong-analyzer = "mahjong_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
